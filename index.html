<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10121a">
  <meta name="description" content="Персональное приложение для практики английского: уроки, слова, разговоры и прогресс.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Englishly — твой английский</title>
  <style>
:root{color-scheme:dark;--bg:#0d0f16;--card:#171a24;--raised:#1b1e2d;--text:#f1f3fc;--muted:#a0a7bb;--line:#2d3242;--accent:#9694ff;--accent-dark:#c1bfff;--accent-soft:#292844;--mint:#18382f;--mint-ink:#8ae1bf;--yellow:#3a301b;--yellow-ink:#f5ce77;--pink:#3a222d;--pink-ink:#ff9db4;--good:#39b88b;--bad:#df728a;--shadow:0 14px 36px rgba(0,0,0,.22);--ease:cubic-bezier(.22,1,.36,1);--fast:.18s;--mid:.34s}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #aaa8ff;outline-offset:3px}
p{line-height:1.5}
h1{font-size:clamp(28px,6vw,39px);letter-spacing:-1.6px;line-height:1.08;margin:0;font-weight:800}
h2{font-size:21px;letter-spacing:-.6px;margin:0}
h3{font-size:16px;letter-spacing:-.25px;margin:0}
.eyebrow{color:var(--accent);font-weight:750;letter-spacing:1.1px;text-transform:uppercase;font-size:10px;margin-bottom:9px}
.subtext{color:var(--muted);font-size:14px;margin:9px 0 0}

/* layout */
.app-shell{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.topbar{max-width:1040px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
main{max-width:1040px;margin:0 auto;padding:4px 22px 24px}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:15px;background:var(--accent);color:#11121c;display:grid;place-items:center;flex:none}
.brand-mark svg{width:23px;height:23px}
.brand-name{font-weight:780;letter-spacing:-.7px;font-size:19px}
.brand-tag{color:var(--muted);font-size:12px;margin-top:2px}
.top-stats{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap}
.pill .fire{color:#f08b34}
.greeting,.page-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:14px 0 22px}
.page-title-row p{color:var(--muted);font-size:14px;margin:8px 0 0}
.level-chip{flex:none;background:var(--accent-soft);color:var(--accent-dark);padding:9px 12px;border-radius:12px;font-size:12px;font-weight:750}
.section-head,.card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-head{margin:29px 0 14px}
.text-button{color:var(--accent);font-weight:750;font-size:13px;padding:7px 0}
.icon-box{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--accent-soft)!important;color:var(--accent)!important}
.icon-box svg{width:19px;height:19px}

/* surfaces */
.pill,.lesson-card,.search-wrap,.mini-info,.stat-card,.chart-card,.achievement-card,.mode-card,.mode-shortcut,.compact-stat,.word-row,.streak-card,.result-points,.empty-state,.icon-button,.answer-option,.small-select,.flashcard,.mixed-word-card,.mixed-target,.practice-prompt,.mixed-prompt{background:var(--card);border:1px solid var(--line);color:var(--text)}
.mixed-word-card,.mixed-target,.mixed-prompt,.practice-prompt{background:var(--raised)}
.lesson-icon[style]{background:#26243e!important;color:#c3c1ff!important}
div[style*="background:#f7f7fc"],div[style*="background:#f6f6fc"],div[style*="background:#fafaff"],div[style*="background:#f7f6ff"]{background:#202331!important;color:var(--muted)!important;border-color:var(--line)!important}

/* buttons */
.btn{border-radius:15px;padding:13px 16px;font-weight:750;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-full{width:100%}
.btn-primary{background:var(--accent);color:#11121c}
.btn-primary:disabled{color:#72758b}
.btn-ghost{background:#252938}
.btn-outline{background:var(--card);border:1px solid var(--line)}
.btn-white{background:#fff;color:#4542b9}
.icon-button{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--muted)}
.icon-button svg{width:18px;height:18px}
.filter-row{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:15px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 13px;border-radius:12px;font-weight:700;font-size:12px;white-space:nowrap}
.filter-chip.active{background:var(--accent);color:#11121c;border-color:var(--accent)}

/* home */
.mixed-hero{border:1px solid #35384c;border-radius:25px;padding:clamp(20px,4vw,29px);background:linear-gradient(135deg,#202337,#191c29 62%,#22213a);box-shadow:var(--shadow)}
.mixed-hero-kicker{display:flex;align-items:center;gap:8px;color:#b5b3ff;font-size:10px;font-weight:800;letter-spacing:1.1px}
.mixed-hero-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(150,148,255,.12)}
.mixed-hero h2{font-size:clamp(23px,5vw,30px);margin:17px 0 9px}
.mixed-hero p{color:var(--muted);font-size:14px;max-width:520px;margin:0}
.mixed-hero-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px}
.mixed-hero-meta{display:flex;flex-wrap:wrap;gap:7px}
.mixed-hero-meta span{padding:7px 9px;border:1px solid #35394c;border-radius:10px;font-size:11px;color:#c4c8da}
.home-stats-grid,.mode-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.compact-stat{border-radius:19px;padding:16px;min-width:0}
.compact-stat-label{font-size:12px;color:var(--muted);font-weight:650}
.compact-stat-value{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-top:9px}
.compact-stat-value span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
.compact-stat-foot{font-size:11px;margin-top:8px;color:var(--muted)}
.progress-track,.quiz-bar,.lesson-progress{background:#282c3a;border-radius:99px;overflow:hidden}
.progress-track{height:5px;margin-top:13px}
.progress-fill,.lesson-progress span{display:block;height:100%;background:var(--accent);border-radius:99px}
.mode-shortcut{border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:88px}
.mode-shortcut strong{display:block;font-size:14px}
.mode-shortcut span{display:block;font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}

/* lessons */
.lesson-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.lesson-card{display:flex;align-items:center;gap:14px;padding:17px;border-radius:21px;text-align:left;min-width:0}
.lesson-icon{width:49px;height:49px;border-radius:17px;display:grid;place-items:center;font-size:23px;flex:none}
.lesson-meta{min-width:0;flex:1}
.lesson-meta h3{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-meta p{color:var(--muted);font-size:12px;margin:6px 0 0}
.lesson-progress{margin-top:10px;height:4px}
.lesson-state{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#282c3a;color:var(--muted);flex:none}
.lesson-state.done{background:var(--mint);color:var(--mint-ink)}
.chart-card,.achievement-card{border-radius:23px;padding:21px;margin-top:15px}

/* words */
.search-wrap{display:flex;align-items:center;gap:10px;border-radius:15px;padding:0 13px;margin-bottom:14px}
.search-wrap svg{width:18px;color:var(--muted);flex:none}
.search-wrap input{border:0;outline:0;background:transparent;height:47px;width:100%;min-width:0;font-size:14px}
::placeholder{color:#7d849b}
.word-study{display:grid;grid-template-columns:1fr .9fr;gap:16px}
.flashcard{background:linear-gradient(145deg,#1a1d29,#141722);border-radius:28px;padding:26px;min-height:285px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;box-shadow:var(--shadow);touch-action:pan-y;user-select:none}
.flash-top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700}
.word-badge{background:var(--accent-soft);color:#c3c1ff;border-radius:10px;padding:6px 9px}
.flash-word{font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:-1.5px;margin-top:13px}
.flash-pron{color:var(--muted);font-size:13px;margin-top:6px}
.flash-translation{font-size:21px;font-weight:750;margin-top:21px;color:#b7b5ff}
.flash-example{font-size:13px;color:var(--muted);margin:9px 0 0;max-width:360px}
.flash-actions,.word-nav-controls{display:flex;gap:9px;width:100%;margin-top:20px}
.word-nav-controls{display:grid;grid-template-columns:1fr 1fr;margin-top:13px}
.flash-actions .btn{flex:1;min-width:0;padding:12px 8px;font-size:13px}
.gesture-note{color:var(--muted);font-size:11px;margin-top:8px}
.word-side{display:flex;flex-direction:column;gap:12px}
.mini-info{border-radius:22px;padding:19px}
.mini-info p{font-size:13px;color:var(--muted);margin:8px 0 0}
.mini-stat{font-size:28px;letter-spacing:-1px;font-weight:800;margin-top:15px}
.word-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.word-row{border-radius:17px;padding:13px 14px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.word-row-main{min-width:0;flex:1}
.word-row strong{display:block;font-size:14px}
.word-row span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.known-dot{width:9px;height:9px;border-radius:50%;background:#4a5064;flex:none}
.known-dot.yes{background:#39c99b}
.empty-state{text-align:center;padding:36px 20px;border-radius:22px;color:var(--muted)}
.empty-state .big{font-size:35px;margin-bottom:10px}

/* progress */
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat-card{border-radius:21px;padding:18px}
.stat-label{color:var(--muted);font-size:12px;margin-top:12px}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:5px}
.week-chart{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:132px;margin-top:20px;padding:0 4px}
.chart-column{display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:9px;height:100%;flex:1}
.chart-bar-wrap{height:94px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart-bar{width:min(28px,70%);min-height:5px;background:#282c3a;border-radius:9px 9px 4px 4px;transform-origin:bottom}
.chart-bar.has-value{background:var(--accent)}
.chart-day{color:var(--muted);font-size:11px;font-weight:700}
.achievement-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}
.achievement{background:#1b1e2a;border:1px solid #303448;border-radius:17px;padding:15px 10px;text-align:center}
.achievement.locked{opacity:.45;filter:grayscale(1)}
.achievement .medal{font-size:25px}
.achievement strong{display:block;font-size:12px;margin-top:9px}
.achievement span{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.35}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}
.settings-row:last-child{border-bottom:0}
.small-select{border-radius:11px;padding:9px}
.footer-note{color:var(--muted);font-size:11px;line-height:1.5;margin:20px 0 0;text-align:center}

/* nav, toast */
.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(17,19,28,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav-inner{width:min(620px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.nav-item{color:#8f96ad;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:14px;padding:8px 4px 5px;font-size:10px;font-weight:700}
.nav-item svg{width:21px;height:21px}
.nav-item.active{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#262839;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:650;box-shadow:var(--shadow);opacity:0;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quiz and practice */
.quiz-shell{min-height:100vh;max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.quiz-top{display:flex;align-items:center;gap:13px}
.quiz-bar{flex:1;height:8px}
.quiz-bar span{display:block;height:100%;background:#54c6a0;border-radius:99px}
.quiz-counter{font-size:12px;font-weight:750;color:var(--muted);white-space:nowrap}
.quiz-content{margin:auto 0;padding:40px 0 30px}
.mixed-session .quiz-content{max-width:650px;width:100%;margin:0 auto}
.quiz-tag{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1.2px;font-size:10px}
.quiz-question{font-size:clamp(26px,6vw,35px);line-height:1.18;letter-spacing:-1.1px;margin:14px 0 13px;font-weight:800}
.quiz-hint{color:var(--muted);font-size:14px;margin:0 0 23px}
.quiz-footer{margin-top:auto}
.quiz-footer .btn{min-height:51px}
.mixed-skip{display:block;margin:7px auto 0;font-size:12px}
.question-en{background:#252342;border-radius:16px;padding:17px;margin:20px 0;font-size:19px;font-weight:700;line-height:1.45}
.answer-list{display:flex;flex-direction:column;gap:10px}
.answer-option{display:flex;align-items:center;gap:13px;text-align:left;border:1.5px solid #32374a;border-radius:16px;padding:15px 14px;font-size:15px;font-weight:650;min-height:57px}
.answer-letter{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.answer-option.selected{border-color:var(--accent);background:#272641}
.answer-option.correct{border-color:var(--good);background:#17372f}
.answer-option.wrong{border-color:var(--bad);background:#39212b}
.feedback{margin-top:15px;padding:14px 15px;border-radius:15px;font-size:13px;line-height:1.45}
.feedback.good{background:#17372f;color:#9ce7ca}
.feedback.bad{background:#39212b;color:#ffafc0}
.result-content{text-align:center;margin:auto 0;padding:45px 0}
.result-emoji{font-size:56px}
.result-content h1{margin-top:18px}
.result-score{font-size:14px;color:var(--muted);margin:12px 0 25px}
.result-points{margin:0 auto 25px;border-radius:20px;padding:18px;max-width:290px;display:flex;justify-content:space-around}
.result-points strong{display:block;font-size:22px}
.result-points span{color:var(--muted);font-size:11px}
.practice-prompt,.mixed-prompt{border-radius:20px;padding:20px;margin:20px 0;font-size:20px;line-height:1.45;font-weight:760}
.mixed-prompt{font-size:clamp(22px,6vw,30px);font-weight:800;text-align:center;overflow-wrap:anywhere}
.practice-field,.mixed-input,.mixed-textarea{display:block;width:100%;min-width:0;background:#11141d;border:1px solid #363b50;border-radius:15px;padding:14px 15px;font-size:16px;line-height:1.5;outline:none}
.practice-field,.mixed-textarea{min-height:108px;resize:vertical}
.mixed-input{min-height:54px}
.practice-field:focus,.mixed-input:focus,.mixed-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(150,148,255,.14)}
.mixed-label{display:block;font-size:13px;font-weight:750;margin:0 0 8px}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.word-token{border:1px solid #41445d;border-radius:11px;padding:9px 12px;background:#26243e;color:#d9d8ff;font-weight:700;min-height:40px}
.mixed-word-card{margin:20px 0 4px;border-radius:23px;padding:clamp(20px,5vw,30px);text-align:center}
.mixed-word{font-size:clamp(32px,8vw,44px);font-weight:820;letter-spacing:-1.4px;overflow-wrap:anywhere}
.mixed-pron,.mixed-topic{color:var(--muted);font-size:13px;margin-top:8px}
.mixed-topic{font-size:11px;margin-top:7px}
.mixed-translation{color:var(--accent-dark);font-size:21px;font-weight:750;line-height:1.35;margin-top:21px;overflow-wrap:anywhere}
.mixed-example,.mixed-example-after{display:flex;align-items:center;gap:12px;text-align:left;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
.mixed-example-after{border-color:rgba(255,255,255,.1);padding-top:12px;margin-top:13px}
.mixed-example>span,.mixed-example-after span{color:var(--muted);font-size:11px;white-space:nowrap}
.mixed-example strong,.mixed-example-after strong{flex:1;font-size:13px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.mixed-target{display:flex;flex-direction:column;align-items:flex-start;gap:5px;border-radius:17px;padding:14px 16px;margin:16px 0 20px}
.mixed-target-word{font-size:20px;font-weight:800}
.mixed-target-translation{font-size:13px;color:var(--muted)}
.mixed-feedback-note{font-size:12px;line-height:1.5;margin-top:7px;opacity:.9}

/* motion: one easing, short durations, no layout jumps */
@keyframes softIn{from{opacity:.5;transform:translateY(6px)}}
@keyframes cardIn{from{opacity:0;transform:translate3d(var(--dx,0),8px,0) scale(.985)}}
@keyframes textIn{from{opacity:0;transform:translateY(5px)}}
@keyframes pop{45%{transform:scale(1.025)}}
@keyframes nudge{20%{transform:translateX(-5px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.app-shell main,.quiz-shell{animation:softIn var(--mid) var(--ease) both}
.app-shell main.words-main{animation:none}
.flashcard.swipe-next,.flashcard.swipe-prev{animation:cardIn .55s var(--ease) both}
.flashcard.swipe-next{--dx:10px}
.flashcard.swipe-prev{--dx:-10px}
.flashcard.swipe-next .flash-word,.flashcard.swipe-prev .flash-word{animation:textIn .5s var(--ease) .05s both}
.flashcard.card-exit-right,.flashcard.card-exit-left{opacity:0;transition:opacity .18s ease,transform .18s ease;transform:translate3d(-8px,0,0) scale(.99)}
.flashcard.card-exit-left{transform:translate3d(8px,0,0) scale(.99)}
.answer-option.correct{animation:pop .42s var(--ease)}
.answer-option.wrong{animation:nudge .38s ease}
.feedback{animation:rise .3s var(--ease) both}
/* Mixed practice: staggered, soft entrance instead of moving the whole page at once. */
@keyframes mixedTopIn{from{opacity:0;transform:translate3d(0,-7px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes mixedBodyIn{from{opacity:0;transform:translate3d(0,12px,0) scale(.992)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes mixedCardIn{0%{opacity:0;transform:translate3d(0,14px,0) scale(.978)}72%{opacity:1;transform:translate3d(0,-1px,0) scale(1.003)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes mixedFooterIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.99)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes mixedDetailIn{from{opacity:0;transform:translate3d(0,5px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.quiz-shell.mixed-session{animation:none!important}
.mixed-session .quiz-top{animation:mixedTopIn .48s cubic-bezier(.22,1,.36,1) both}
.mixed-session .quiz-content{animation:mixedBodyIn .56s cubic-bezier(.22,1,.36,1) both;transform-origin:50% 28%}
.mixed-session .quiz-tag{animation:mixedDetailIn .4s cubic-bezier(.22,1,.36,1) .035s both}
.mixed-session .quiz-question{animation:mixedDetailIn .46s cubic-bezier(.22,1,.36,1) .075s both}
.mixed-session .mixed-word-card,.mixed-session .mixed-target,.mixed-session .mixed-prompt{animation:mixedCardIn .62s cubic-bezier(.22,1,.36,1) .075s both;transform-origin:center}

function normEn(s){let t=String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ');t=t.split(/\s+/).map(w=>CONTR[w.replace(/[.,!?;:]+$/,'')]||w).join(' ');return t.replace(/[^a-z0-9 ]/g,' ').replace(/\bpractise\b/g,'practice').replace(/\bmovie\b/g,'film').replace(/\baloud\b/g,'out loud').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sentenceMatches(input,accepted){const x=normEn(input);if(!x)return false;return accepted.some(a=>{const y=normEn(a);return x===y||(y.length>=12&&lev(x,y)<=1);});}
function recallMatches(answer,en){const x=normEn(answer),y=normEn(en);if(!x)return false;return [y,y.replace(/^to /,''),y.replace(/^(i|would) /,'')].some(o=>o&&(x===o||(o.length>=5&&lev(x,o)<=1)));}
function tokMatch(w,t){if(!t)return false;if(t===w)return true;if(IRR[w]&&IRR[w].split(' ').includes(t))return true;if(w.endsWith('self')&&t.endsWith('self'))return true;const s=w.length>3&&w.endsWith('e')?w.slice(0,-1):w;return w.length>=3&&t.startsWith(s)&&t.length<=w.length+3;}
function containsTargetPhrase(sentence,target){const s=normEn(sentence).split(' ');let p=normEn(target).split(' ').filter(Boolean);if(p.length>1&&p[0]==='to')p=p.slice(1);if(!p.length||!s[0])return false;for(let i=0;i+p.length<=s.length;i++){if(p.every((w,k)=>tokMatch(w,s[i+k])))return true;}return false;}

function shuffleArray(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startPractice(mode){

    const repeats=shuffleArray(promptedVocab.filter(v=>state.repeatWords.includes(v.id)));
    const newWords=shuffleArray(promptedVocab.filter(v=>!state.knownWords.includes(v.id)&&!state.repeatWords.includes(v.id)));
    const known=shuffleArray(promptedVocab.filter(v=>state.knownWords.includes(v.id)));
    const chosen=[...repeats,...newWords,...known].slice(0,5);
    practice={type:'mixed',questions:chosen,index:0,stage:'learn',recallDraft:'',recallChecked:false,recallCorrect:false,recallError:false,sentenceDraft:'',sentenceChecked:false,hintLevel:0,hintMax:0,hintBank:null,correct:0,xpBefore:state.xp,finished:false};
  } else if(mode==='ru-en'){

    const questions=chosen.map(word=>{const wrong=shuffleArray(vocab.filter(v=>v.id!==word.id)).slice(0,3);const options=shuffleArray([word,...wrong]);return {word,options,correctIndex:options.findIndex(v=>v.id===word.id)};});

  } else {
    const questions=shuffleArray(sentenceBank).slice(0,10).map(q=>({...q,bank:shuffleArray(q.en.replace(/[.!?]/g,'').split(/\s+/))}));
    practice={type:'sentence',questions,index:0,selected:null,checked:false,correct:0,xpBefore:state.xp,finished:false,draft:'',hintVisible:false,usedHint:false};

function normalizeMixedAnswer(value){return String(value||'').toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();}
function checkMixedRecall(){
  if(!practice||practice.type!=='mixed'||practice.stage!=='recall'||practice.recallChecked)return;
  const answer=normalizeMixedAnswer(practice.recallDraft);
  if(!answer){showToast('Сначала введи английское слово');return;}
  const word=practice.questions[practice.index];
  practice.recallChecked=true;practice.recallCorrect=recallMatches(answer,word.en);state.answered++;
  if(practice.recallCorrect){state.correct++;addXp(5);showToast('Верно! +5 XP');}
  else{practice.recallError=true;state.repeatWords=Array.from(new Set([...state.repeatWords,word.id]));state.knownWords=state.knownWords.filter(id=>id!==word.id);saveState();showToast('Ничего страшного — слово вернётся на повторение');}
  render();
}
function checkMixedSentence(){
  if(!practice||practice.type!=='mixed'||practice.stage!=='compose'||practice.sentenceChecked)return;
  const word=practice.questions[practice.index];
  const draft=String(practice.sentenceDraft||'').trim();
  if(!draft){showToast('Сначала напиши своё предложение');return;}
  if(!containsTargetPhrase(draft,word.en)){showToast('Добавь в предложение выражение: '+word.en);return;}
  const answerWords=normEn(draft).split(' ').filter(Boolean);
  const targetWordCount=normEn(word.en).split(' ').filter(Boolean).length;
  const minWords=Math.max(3,targetWordCount+2);
  if(answerWords.length<minWords){showToast('Это пока только выражение. Напиши минимум '+minWords+' слов.');return;}
  practice.sentenceChecked=true;const hx=[8,5,2][practice.hintMax||0];addXp(hx);showToast('Выражение найдено! +'+hx+' XP');render();

    return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-practice" aria-label="Выйти из практики">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((p.index+(p.checked?1:0))/total*100)}%"></span></div><div class="quiz-counter">${p.index+1}/${total}</div></div><div class="quiz-content"><div class="quiz-tag">🧠 АКТИВНОЕ ВСПОМИНАНИЕ</div><h1 class="quiz-question">Как будет по-английски?</h1><p class="quiz-hint">Сначала вспомни слово сам, затем выбери ответ.</p><div class="practice-prompt">${esc(q.word.ru)}<div style="font-size:12px;color:var(--muted);font-weight:550;margin-top:8px">${q.word.topic}</div></div><div class="answer-list">${q.options.map((v,i)=>{let cls='';if(p.checked&&i===q.correctIndex)cls='correct';else if(p.checked&&i===p.selected)cls='wrong';return `<button class="answer-option ${cls}" data-action="practice-answer" data-index="${i}" ${p.checked?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span>${esc(v.en)}</span>${p.checked&&i===q.correctIndex?`<span style="margin-left:auto;color:#57d6a8">${icon('check',17)}</span>`:''}</button>`;}).join('')}</div>${p.checked?`<div class="feedback ${p.selected===q.correctIndex?'good':'bad'}"><strong>${p.selected===q.correctIndex?'Верно! Отлично 👏':'Правильный ответ:'}</strong><div style="margin-top:5px">${esc(q.word.en)} — ${esc(q.word.ru)}<br><span style="opacity:.86">${esc(q.word.ex)}</span></div><button class="text-button" data-action="speak" data-text="${esc(q.word.ex)}">${icon('speaker',13)} Послушать пример</button></div>`:''}</div><div class="quiz-footer">${p.checked?`<button class="btn btn-primary btn-full" data-action="practice-next">${p.index===total-1?'Завершить':'Следующее слово'} ${icon('arrow',16)}</button>`:`<p class="gesture-note">За правильный ответ — 5 XP.</p>`}</div></div>`;
  }
  return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-practice" aria-label="Выйти из практики">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((p.index+(p.checked?1:0))/total*100)}%"></span></div><div class="quiz-counter">${p.index+1}/${total}</div></div><div class="quiz-content"><div class="quiz-tag">✍️ СОСТАВЛЕНИЕ ПРЕДЛОЖЕНИЙ</div><h1 class="quiz-question">Скажи это по-английски</h1><p class="quiz-hint">Постарайся написать всё сам. Если застрянешь — открой подсказку со словами.</p><div class="practice-prompt">${esc(q.ru)}</div><label for="sentenceDraft" style="display:block;font-weight:750;font-size:13px;margin:0 0 8px">Твой вариант на английском</label><textarea id="sentenceDraft" class="practice-field" placeholder="Начни писать предложение здесь…" ${p.checked?'readonly':''}>${esc(p.draft)}</textarea><div class="card-heading" style="margin-top:13px"><button class="btn btn-ghost" data-action="toggle-hint" ${p.checked?'disabled':''}>${p.hintVisible?'Скрыть подсказку':'Подсказка: показать слова'}</button><button class="btn btn-outline" data-action="clear-draft" ${p.checked?'disabled':''}>Очистить</button></div>${p.hintVisible&&!p.checked?`<p class="subtext" style="margin:13px 0 4px">Слова в случайном порядке — нажимай, чтобы вставить в текст:</p><div class="word-bank">${q.bank.map((token,i)=>`<button class="word-token" data-action="sentence-token" data-token="${esc(token)}">${esc(token)}</button>`).join('')}</div><p class="gesture-note">${esc(q.hint||'Используй слова как подсказку и собери фразу самостоятельно.')}</p>`:''}${p.checked?`<div class="feedback ${p.isCorrect?'good':'bad'}"><strong>${p.isCorrect?'Правильно! Отличная работа 🎉':'Хорошая попытка — сравни с естественным вариантом.'}</strong><div style="margin-top:6px"><strong>Вариант:</strong> ${esc(q.en)}</div>${q.hint?`<div style="margin-top:5px;opacity:.9">💡 ${esc(q.hint)}</div>`:''}</div>`:''}</div><div class="quiz-footer">${p.checked?`<button class="btn btn-primary btn-full" data-action="practice-next">${p.index===total-1?'Завершить практику':'Следующее предложение'} ${icon('arrow',16)}</button>`:`<button class="btn btn-primary btn-full" data-action="check-sentence">Проверить мой вариант ${icon('arrow',16)}</button><p class="gesture-note">Правильный ответ приносит 8 XP. Варианты с тем же смыслом могут отличаться.</p>`}</div></div>`;
}

function renderQuiz(){const l=quiz.lesson;if(quiz.finished){const r=quiz.result;const total=r.total;const perfect=r.correct===total;return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-quiz" aria-label="Закрыть">${icon('close')}</button><div style="font-weight:800;font-size:14px">Урок завершён</div></div><div class="result-content"><div class="result-emoji">${perfect?'🏆':r.correct>=3?'🎉':'💪'}</div><h1>${perfect?'Идеально!':r.correct>=3?'Отличная работа!':'Хорошая практика!'}</h1><p class="result-score">${l.title} · ты ответил правильно на ${r.correct} из ${total} вопросов.</p><div class="result-points"><div><strong>+${quiz.xpEarned}</strong><span>XP получено</span></div><div><strong>${Math.round(r.correct/total*100)}%</strong><span>Точность</span></div></div><p style="color:var(--muted);font-size:14px;max-width:340px;margin:0 auto 26px">${perfect?'Все ответы верные — так держать!':`Повтори ошибки и попробуй ещё раз. Ошибки — это часть обучения.`} Твой прогресс сохранён на устройстве.</p><button class="btn btn-primary btn-full" data-action="close-quiz">Продолжить ${icon('arrow',16)}</button><button class="btn btn-ghost btn-full" style="margin-top:9px" data-action="lesson" data-id="${l.id}">Пройти ещё раз</button></div></div>`;}
const q=l.questions[quiz.index],letters=['A','B','C','D'];return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-quiz" aria-label="Выйти из урока">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((quiz.index+(quiz.checked?1:0))/l.questions.length*100)}%"></span></div><div class="quiz-counter">${quiz.index+1}/${l.questions.length}</div></div><div class="quiz-content"><div class="quiz-tag">${l.emoji} ${l.tag} · ${l.title}</div><h1 class="quiz-question">${q.q}</h1><p class="quiz-hint">Выбери лучший вариант ответа.</p><div class="question-en">${q.en}<button class="icon-button" data-action="speak" data-text="${esc(q.en)}" aria-label="Прослушать фразу" style="float:right;margin-left:8px;width:34px;height:34px">${icon('speaker',16)}</button></div><div class="answer-list">${q.options.map((o,i)=>{let cls='';if(quiz.checked&&i===q.a)cls='correct';else if(quiz.checked&&i===quiz.selected)cls='wrong';else if(!quiz.checked&&i===quiz.selected)cls='selected';return `<button class="answer-option ${cls}" data-action="answer" data-index="${i}" ${quiz.checked?'disabled':''}><span class="answer-letter">${letters[i]}</span><span>${o}</span>${quiz.checked&&i===q.a?`<span style="margin-left:auto;color:#18815b">${icon('check',17)}</span>`:''}</button>`;}).join('')}</div>${quiz.checked?`<div class="feedback ${quiz.selected===q.a?'good':'bad'}"><strong>${quiz.selected===q.a?'Верно! Отлично 👏':'Почти! Запомни этот вариант.'}</strong><div style="margin-top:5px">${q.why}</div></div>`:''}<div style="margin-top:18px;background:#f7f7fc;padding:14px;border-radius:14px;font-size:12px;color:var(--muted)"><strong style="color:var(--text)">Подсказка</strong><br>${l.tip}</div></div><div class="quiz-footer">${quiz.checked?`<button class="btn btn-primary btn-full" data-action="next-question">${quiz.index===l.questions.length-1?'Завершить урок':'Дальше'} ${icon('arrow',16)}</button>`:`<button class="btn btn-primary btn-full" disabled style="opacity:.42;cursor:not-allowed">Выбери ответ</button>`}</div></div>`;}
function render(){const root=document.getElementById('app');if(quiz){root.innerHTML=renderQuiz();return;}if(practice){root.innerHTML=renderPractice();wireInputs();return;}const tabContent=state.tab==='home'?renderHome():state.tab==='lessons'?renderLessons():state.tab==='words'?renderWords():renderProgress();root.innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">${icon('logo',23)}</div><div><div class="brand-name">englishly<span style="color:var(--accent)">.</span></div><div class="brand-tag">Английский в твоём ритме</div></div></div><div class="top-stats"><div class="pill"><span class="fire">🔥</span> ${state.streak}</div><div class="pill">${icon('trophy',14)} ${state.xp} XP</div></div></header><main class="${state.tab==='words'?'words-main':''}">${tabContent}</main><nav class="bottom-nav" aria-label="Главная навигация"><div class="nav-inner"><button class="nav-item ${state.tab==='home'?'active':''}" data-action="tab" data-tab="home">${icon('home',21)}<span>Сегодня</span></button><button class="nav-item ${state.tab==='lessons'?'active':''}" data-action="tab" data-tab="lessons">${icon('book',21)}<span>Уроки</span></button><button class="nav-item ${state.tab==='words'?'active':''}" data-action="tab" data-tab="words">${icon('cards',21)}<span>Слова</span></button><button class="nav-item ${state.tab==='progress'?'active':''}" data-action="tab" data-tab="progress">${icon('chart',21)}<span>Прогресс</span></button></div></nav></div>`;wireInputs();wordDirection=0;}
function wireInputs(){
  const search=document.getElementById('wordSearch');
  if(search){search.addEventListener('input',e=>{const pos=e.target.selectionStart;state.wordSearch=e.target.value;state.currentWord=0;state.wordFlipped=false;const root=document.getElementById('app');const main=root.querySelector('main');main.innerHTML=renderWords();const next=document.getElementById('wordSearch');if(next){next.focus();next.setSelectionRange(pos,pos);}wireInputs();saveState();});}
  const goal=document.getElementById('goalSelect');if(goal)goal.addEventListener('change',e=>{state.goal=Number(e.target.value);saveState();render();showToast('Ежедневная цель обновлена');});
  const draft=document.getElementById('sentenceDraft');if(draft)draft.addEventListener('input',e=>{if(practice&&practice.type==='sentence'&&!practice.checked)practice.draft=e.target.value;});
  const mixedRecall=document.getElementById('mixedRecallDraft');if(mixedRecall)mixedRecall.addEventListener('input',e=>{if(practice&&practice.type==='mixed'&&practice.stage==='recall'&&!practice.recallChecked)practice.recallDraft=e.target.value;});
  const mixedSentence=document.getElementById('mixedSentenceDraft');if(mixedSentence)mixedSentence.addEventListener('input',e=>{if(practice&&practice.type==='mixed'&&practice.stage==='compose'&&!practice.sentenceChecked)practice.sentenceDraft=e.target.value;});
  const card=document.querySelector('.flashcard');if(card){let sx=0,sy=0;card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});card.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.25){changeWord(dx<0?1:-1);}});}
}
function changeWord(dir,animate=false){const list=selectedWords();if(!list.length)return;const go=()=>{state.currentWord=(state.currentWord+dir+list.length)%list.length;state.wordFlipped=false;wordDirection=dir;saveState();render();};if(animate){const card=document.querySelector('.flashcard');if(card){card.classList.add(dir<0?'card-exit-left':'card-exit-right');window.setTimeout(go,190);return;}}go();}
function markWordAndAdvance(id,known){const list=selectedWords();if(known){if(!state.knownWords.includes(id)){state.knownWords.push(id);state.repeatWords=state.repeatWords.filter(x=>x!==id);addXp(2);showToast('Слово добавлено в «Знаю» · +2 XP');}else showToast('Уже отмечено как знакомое');}else{state.repeatWords=Array.from(new Set([...state.repeatWords,id]));state.knownWords=state.knownWords.filter(x=>x!==id);showToast('Добавлено на повторение');}saveState();if(list.length>1)changeWord(1,true);else{state.wordFlipped=false;render();}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action;switch(act){
case'tab':quiz=null;practice=null;wordDirection=btn.dataset.tab==='words'?1:0;navTab(btn.dataset.tab);break;
case'lesson':practice=null;startLesson(btn.dataset.id);break;
case'answer':chooseAnswer(Number(btn.dataset.index));break;
case'next-question':nextQuestion();break;
case'close-quiz':closeQuiz();break;
case'speak':speak(btn.dataset.text||'');break;
case'word-filter':state.wordFilter=btn.dataset.filter;state.currentWord=0;state.wordFlipped=false;wordDirection=1;saveState();render();break;
case'flip-word':state.wordFlipped=true;render();break;
case'next-word':changeWord(1);break;
case'prev-word':changeWord(-1);break;
case'select-word':{const list=selectedWords();const ix=list.findIndex(v=>v.id===btn.dataset.id);if(ix>=0){state.currentWord=ix;state.wordFlipped=true;wordDirection=1;render();window.scrollTo({top:0,behavior:'smooth'});}break;}
case'word-known':{markWordAndAdvance(btn.dataset.id,true);break;}
case'word-repeat':{markWordAndAdvance(btn.dataset.id,false);break;}
case'start-practice':startPractice(btn.dataset.mode);break;
case'practice-answer':answerPractice(Number(btn.dataset.index));break;
case'practice-next':nextPractice();break;
case'mixed-advance':advanceMixed();break;
case'mixed-check-recall':checkMixedRecall();break;
case'mixed-check-sentence':checkMixedSentence();break;
case'mixed-skip':skipMixedWord();break;
case'mixed-hint':mixedHint();break;
case'mixed-token':addMixedToken(btn.dataset.token);break;
case'mixed-clear':clearMixedDraft();break;
case'close-practice':closePractice();break;
case'check-sentence':checkSentence();break;
case'toggle-hint':if(practice&&!practice.checked){practice.hintVisible=!practice.hintVisible;render();}break;
case'clear-draft':if(practice&&!practice.checked){practice.draft='';render();document.getElementById('sentenceDraft')?.focus();}break;
case'sentence-token':addSentenceToken(btn.dataset.token);break;
case'reset':if(confirm('Точно сбросить весь прогресс? Это действие нельзя отменить.')){state=defaultState();quiz=null;practice=null;saveState();render();showToast('Прогресс сброшен');}break;
}});
if('serviceWorker'in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6',{updateViaCache:'none'}).catch(()=>{}));}
render();
</script>
</body>
</html>
