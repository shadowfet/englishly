<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10121a">
  <meta name="description" content="Персональное приложение для практики английского: уроки, слова, разговоры и прогресс.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Englishly — твой английский</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f16;
      --surface: rgba(23,26,37,.92);
      --card: #171a24;
      --text: #f1f3fc;
      --muted: #a0a7bb;
      --line: #2d3242;
      --accent: #9694ff;
      --accent-dark: #c1bfff;
      --accent-soft: #292844;
      --mint: #18382f;
      --mint-ink: #8ae1bf;
      --yellow: #3a301b;
      --yellow-ink: #f5ce77;
      --pink: #3a222d;
      --pink-ink: #ff9db4;
      --shadow: 0 16px 42px rgba(0, 0, 0, .24);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:3px solid #aaa8ff; outline-offset:3px; }
    .app-shell { min-height:100vh; padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
    .topbar { max-width:1040px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 22px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; gap:11px; align-items:center; min-width:0; }
    .brand-mark { width:42px;height:42px;border-radius:15px;background:var(--accent);color:white;display:grid;place-items:center;box-shadow:0 7px 15px rgba(89,87,232,.22);flex:none; }
    .brand-mark svg { width:23px;height:23px; }
    .brand-name { font-weight:780; letter-spacing:-.7px; font-size:19px; }
    .brand-tag { color:var(--muted); font-size:12px; margin-top:2px; }
    .top-stats { display:flex; gap:8px; align-items:center; }
    .pill { display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap; }
    .pill .fire { color:#f08b34; }
    main { max-width:1040px; margin:0 auto; padding:4px 22px 24px; }
    .greeting { display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:12px 0 23px; }
    .eyebrow { color:var(--accent);font-weight:750;letter-spacing:1.1px;text-transform:uppercase;font-size:10px;margin-bottom:9px; }
    h1 { font-size:clamp(28px,6vw,39px);letter-spacing:-1.6px;line-height:1.08;margin:0;font-weight:800; }
    h2 { font-size:21px;letter-spacing:-.6px;margin:0; }
    h3 { font-size:16px;letter-spacing:-.25px;margin:0; }
    p { line-height:1.5; }
    .subtext { color:var(--muted);font-size:14px;margin:9px 0 0; }
    .level-chip { flex:none;background:var(--accent-soft);color:var(--accent-dark);padding:9px 12px;border-radius:12px;font-size:12px;font-weight:750; }
    .hero-grid { display:grid;grid-template-columns:1.25fr .75fr;gap:16px; }
    .hero-card { position:relative;overflow:hidden;border-radius:28px;padding:25px;background:linear-gradient(135deg,#625ff1 0%,#7774ef 68%,#9795fa 100%);color:#fff;min-height:250px;box-shadow:0 18px 36px rgba(89,87,232,.2); }
    .hero-card:after { content:""; position:absolute; width:210px;height:210px;right:-57px;bottom:-88px;border:1px solid rgba(255,255,255,.22);border-radius:50%;box-shadow:0 0 0 24px rgba(255,255,255,.055),0 0 0 50px rgba(255,255,255,.045); }
    .hero-label { display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.16);padding:7px 10px;border-radius:11px;font-size:11px;font-weight:700; }
    .hero-card h2 { margin:18px 0 9px;font-size:25px;max-width:300px;line-height:1.15;letter-spacing:-.8px; }
    .hero-card p { margin:0;color:rgba(255,255,255,.84);font-size:13px;max-width:320px; }
    .hero-bottom { display:flex;align-items:center;gap:12px;margin-top:22px;position:relative;z-index:1; }
    .btn { border:0;border-radius:15px;padding:13px 16px;font-weight:750;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,filter .12s ease; }
    .btn:active { transform:scale(.98); }
    .btn-primary { background:var(--accent);color:white; }
    .btn-primary:hover { filter:brightness(.97); }
    .btn-white { background:#fff;color:var(--accent-dark); }
    .btn-ghost { background:#f2f2f8;color:#393b4a; }
    .btn-outline { border:1px solid var(--line);background:#fff;color:var(--text); }
    .btn-full { width:100%; }
    .hero-progress { font-size:12px;color:rgba(255,255,255,.86); }
    .goal-card { padding:23px;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:250px; }
    .card-heading { display:flex;align-items:center;justify-content:space-between;gap:10px; }
    .icon-box { width:38px;height:38px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none; }
    .icon-box svg { width:19px;height:19px; }
    .goal-number { font-size:33px;font-weight:800;letter-spacing:-1.3px;margin-top:20px; }
    .goal-number span { font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0; }
    .progress-track { height:8px;background:#eeeeF5;border-radius:99px;overflow:hidden;margin-top:13px; }
    .progress-fill { height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease; }
    .goal-foot { display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:9px; }
    .section-head { display:flex;align-items:center;justify-content:space-between;gap:12px;margin:29px 0 14px; }
    .text-button { border:0;background:transparent;color:var(--accent);font-weight:750;font-size:13px;padding:7px 0; }
    .quick-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:12px; }
    .quick-card { background:var(--card);border:1px solid var(--line);border-radius:21px;padding:17px;display:flex;align-items:flex-start;gap:12px;text-align:left;color:var(--text);min-height:105px;transition:transform .13s ease,box-shadow .13s ease; }
    .quick-card:hover { transform:translateY(-2px);box-shadow:var(--shadow); }
    .quick-card p { color:var(--muted);font-size:12px;margin:6px 0 0;line-height:1.4; }
    .quick-title { font-size:14px;font-weight:750; }
    .quick-card .icon-box { width:36px;height:36px; }
    .streak-card { margin-top:16px;background:#fff;border:1px solid var(--line);padding:19px 20px;border-radius:23px;display:flex;align-items:center;justify-content:space-between;gap:16px; }
    .streak-left { display:flex;align-items:center;gap:13px; }
    .streak-emoji { width:46px;height:46px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;font-size:23px; }
    .streak-days { display:flex;gap:7px;align-items:center; }
    .day-dot { width:25px;height:25px;border-radius:50%;background:#f0f1f7;color:#a0a3b2;display:grid;place-items:center;font-size:10px;font-weight:750; }
    .day-dot.active { background:var(--accent);color:#fff; }
    .day-dot.today { box-shadow:0 0 0 3px var(--accent-soft); }
    .lesson-list { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px; }
    .lesson-card { display:flex;align-items:center;gap:14px;padding:17px;border:1px solid var(--line);background:#fff;border-radius:21px;text-align:left;color:var(--text);min-width:0; }
    .lesson-card:hover { box-shadow:var(--shadow); }
    .lesson-icon { width:49px;height:49px;border-radius:17px;display:grid;place-items:center;font-size:23px;flex:none; }
    .lesson-meta { min-width:0;flex:1; }
    .lesson-meta h3 { font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .lesson-meta p { color:var(--muted);font-size:12px;margin:6px 0 0; }
    .lesson-state { width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#f3f3f8;color:#85889a;flex:none; }
    .lesson-state.done { background:var(--mint);color:var(--mint-ink); }
    .lesson-progress { margin-top:10px;height:4px;background:#f0f0f5;border-radius:99px;overflow:hidden; }
    .lesson-progress span { display:block;height:100%;background:var(--accent);border-radius:99px; }
    .page-title-row { display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:15px 0 22px; }
    .page-title-row p { color:var(--muted);font-size:14px;margin:8px 0 0; }
    .filter-row { display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:15px;scrollbar-width:none; }
    .filter-row::-webkit-scrollbar { display:none; }
    .filter-chip { border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:12px;font-weight:700;font-size:12px;white-space:nowrap; }
    .filter-chip.active { background:var(--accent);color:white;border-color:var(--accent); }
    .search-wrap { display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 13px;margin-bottom:14px; }
    .search-wrap svg { width:18px;color:var(--muted);flex:none; }
    .search-wrap input { border:0;outline:0;background:transparent;height:47px;width:100%;min-width:0;color:var(--text);font-size:14px; }
    .word-study { display:grid;grid-template-columns:1fr .9fr;gap:16px;align-items:stretch; }
    .flashcard { background:linear-gradient(145deg,#fff,#fafaff);border:1px solid var(--line);border-radius:28px;padding:26px;min-height:285px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;box-shadow:var(--shadow); }
    .flash-top { position:absolute;top:18px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700; }
    .word-badge { background:var(--accent-soft);color:var(--accent-dark);border-radius:10px;padding:6px 9px; }
    .flash-word { font-size:clamp(30px,7vw,42px);font-weight:800;letter-spacing:-1.5px;margin-top:13px; }
    .flash-pron { color:var(--muted);font-size:13px;margin-top:6px; }
    .flash-translation { font-size:21px;font-weight:750;margin-top:21px; }
    .flash-example { font-size:13px;color:var(--muted);margin:9px 0 0;max-width:360px; }
    .flash-actions { display:flex;gap:9px;width:100%;margin-top:22px; }
    .flash-actions .btn { flex:1;padding:12px 8px;font-size:13px; }
    .word-side { display:flex;flex-direction:column;gap:12px; }
    .mini-info { background:#fff;border:1px solid var(--line);border-radius:22px;padding:19px; }
    .mini-info p { font-size:13px;color:var(--muted);margin:8px 0 0; }
    .mini-stat { font-size:28px;letter-spacing:-1px;font-weight:800;margin-top:15px; }
    .word-list { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px; }
    .word-row { background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--text);min-width:0; }
    .word-row-main { min-width:0;flex:1; }
    .word-row strong { display:block;font-size:14px; }
    .word-row span { display:block;font-size:12px;color:var(--muted);margin-top:4px; }
    .word-row .known-dot { width:9px;height:9px;border-radius:50%;background:#d6d8e4;flex:none; }
    .word-row .known-dot.yes { background:#2eb887; }
    .stats-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }
    .stat-card { background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px; }
    .stat-label { color:var(--muted);font-size:12px;margin-top:12px; }
    .stat-value { font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:5px; }
    .chart-card,.achievement-card { background:#fff;border:1px solid var(--line);border-radius:23px;padding:21px;margin-top:15px; }
    .week-chart { display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:132px;margin-top:20px;padding:0 4px; }
    .chart-column { display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:9px;height:100%;flex:1; }
    .chart-bar-wrap { height:94px;width:100%;display:flex;align-items:flex-end;justify-content:center; }
    .chart-bar { width:min(28px,70%);min-height:5px;background:#e5e4ff;border-radius:9px 9px 4px 4px; }
    .chart-bar.has-value { background:var(--accent); }
    .chart-day { color:var(--muted);font-size:11px;font-weight:700; }
    .achievement-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px; }
    .achievement { background:#fafaff;border:1px solid #eeeefa;border-radius:17px;padding:15px 10px;text-align:center; }
    .achievement.locked { opacity:.45;filter:grayscale(1); }
    .achievement .medal { font-size:25px; }
    .achievement strong { display:block;font-size:12px;margin-top:9px; }
    .achievement span { display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.35; }
    .bottom-nav { position:fixed;z-index:20;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.91);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(222,224,234,.85);display:flex;justify-content:center; }
    .nav-inner { width:min(620px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px; }
    .nav-item { border:0;background:transparent;color:#9699a9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:14px;padding:8px 4px 5px;font-size:10px;font-weight:700; }
    .nav-item svg { width:21px;height:21px;stroke-width:1.9; }
    .nav-item.active { color:var(--accent);background:var(--accent-soft); }
    .quiz-shell { min-height:100vh;max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column; }
    .quiz-top { display:flex;align-items:center;gap:13px; }
    .icon-button { width:39px;height:39px;border-radius:13px;border:1px solid var(--line);background:#fff;color:#6f7382;display:grid;place-items:center;flex:none; }
    .icon-button svg { width:18px;height:18px; }
    .quiz-bar { flex:1;height:8px;border-radius:99px;background:#e9eaf2;overflow:hidden; }
    .quiz-bar span { display:block;height:100%;background:#54c6a0;border-radius:99px;transition:width .2s ease; }
    .quiz-counter { font-size:12px;font-weight:750;color:var(--muted);white-space:nowrap; }
    .quiz-content { margin:auto 0; padding:40px 0 30px; }
    .quiz-tag { color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1.2px;font-size:10px; }
    .quiz-question { font-size:clamp(26px,6vw,35px);line-height:1.18;letter-spacing:-1.1px;margin:14px 0 13px;font-weight:800; }
    .quiz-hint { color:var(--muted);font-size:14px;margin:0 0 23px; }
    .question-en { background:#f1f0ff;border-radius:16px;padding:17px;margin:20px 0;font-size:19px;font-weight:700;line-height:1.45; }
    .answer-list { display:flex;flex-direction:column;gap:10px; }
    .answer-option { display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1.5px solid #e7e8f0;border-radius:16px;padding:15px 14px;color:var(--text);font-size:15px;font-weight:650;min-height:57px; }
    .answer-letter { width:28px;height:28px;border:1px solid #e5e6ee;border-radius:9px;color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none; }
    .answer-option.selected { border-color:var(--accent);background:#f7f6ff; }
    .answer-option.correct { border-color:#39b88b;background:#f1fcf7; }
    .answer-option.wrong { border-color:#e8758b;background:#fff5f7; }
    .answer-option.correct .answer-letter { background:#d7f6e9;border-color:#a8e7cd;color:#187650; }
    .feedback { margin-top:15px;padding:14px 15px;border-radius:15px;font-size:13px;line-height:1.45; }
    .feedback.good { background:#e8faf2;color:#176e4d; }
    .feedback.bad { background:#fff0f3;color:#a2334e; }
    .quiz-footer { margin-top:auto; }
    .quiz-footer .btn { min-height:51px; }
    .result-content { text-align:center;margin:auto 0;padding:45px 0; }
    .result-emoji { font-size:56px; }
    .result-content h1 { margin-top:18px; }
    .result-score { font-size:14px;color:var(--muted);margin:12px 0 25px; }
    .result-points { margin:0 auto 25px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;max-width:290px;display:flex;justify-content:space-around; }
    .result-points strong { display:block;font-size:22px; }
    .result-points span { color:var(--muted);font-size:11px; }
    .empty-state { text-align:center;padding:36px 20px;background:#fff;border:1px solid var(--line);border-radius:22px;color:var(--muted); }
    .empty-state .big { font-size:35px;margin-bottom:10px; }
    .toast { position:fixed;z-index:50;left:50%;bottom:calc(95px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#202130;color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:650;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .2s ease;max-width:calc(100% - 40px);text-align:center; }
    .toast.show { opacity:1;transform:translate(-50%,0); }
    .settings-row { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px; }
    .settings-row:last-child { border-bottom:0; }
    .small-select { border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;color:var(--text); }
    .footer-note { color:var(--muted);font-size:11px;line-height:1.5;margin:20px 0 0;text-align:center; }
    @media (min-width:800px) { .topbar { padding-top:24px; } .app-shell { padding-bottom:110px; } .bottom-nav { bottom:18px;left:50%;right:auto;transform:translateX(-50%);width:min(620px,calc(100% - 40px));border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 35px rgba(35,39,75,.1);padding:9px 12px; } body { padding-bottom:18px; } }
    @media (max-width:660px) {
      .topbar { padding-left:17px;padding-right:17px; }
      main { padding-left:17px;padding-right:17px; }
      .hero-grid { grid-template-columns:1fr; }
      .hero-card { min-height:240px; }
      .goal-card { min-height:200px; }
      .quick-grid { grid-template-columns:1fr; }
      .quick-card { min-height:80px;align-items:center; }
      .quick-card .icon-box { width:42px;height:42px; }
      .streak-card { align-items:flex-start;flex-direction:column; }
      .streak-days { width:100%;justify-content:space-between; }
      .lesson-list { grid-template-columns:1fr; }
      .word-study { grid-template-columns:1fr; }
      .word-side { display:grid;grid-template-columns:1fr 1fr; }
      .word-list { grid-template-columns:1fr; }
      .stats-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .page-title-row { align-items:flex-start; }
      .achievement-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .achievement { padding:12px 6px; }
      .top-stats .pill { padding:8px 9px;font-size:12px; }
    }
    @media (max-width:390px) { .brand-tag { display:none; } .brand-mark { width:38px;height:38px; } .top-stats { gap:5px; } .pill { gap:4px; } .word-side { grid-template-columns:1fr; } .quiz-shell { padding-left:17px;padding-right:17px; } }
  
    /* Englishly dark mode, micro-interactions and motion */
    body { background:var(--bg); color:var(--text); }
    .pill,.goal-card,.quick-card,.streak-card,.lesson-card,.search-wrap,.flashcard,.mini-info,.word-row,.stat-card,.chart-card,.achievement-card,.result-points,.empty-state,.icon-button,.answer-option,.small-select {
      background:var(--card) !important; color:var(--text); border-color:var(--line) !important;
    }
    .bottom-nav { background:rgba(17,19,28,.92);border-color:var(--line); }
    div[style*="background:#f7f7fc"],div[style*="background:#f6f6fc"],div[style*="background:#fafaff"],div[style*="background:#f7f6ff"] { background:#202331 !important;color:var(--muted) !important;border-color:var(--line) !important; }
    .lesson-icon[style] { background:#26243e !important;color:#c3c1ff !important; }
    .lesson-state { background:#282c3a;color:var(--muted); }
    .lesson-state.done { background:#18382f;color:#8ae1bf; }
    .word-row .known-dot { background:#4a5064; }
    .word-row .known-dot.yes { background:#39c99b; }
    .progress-fill { background:var(--accent); }
    .flash-actions { display:flex;gap:9px;width:100%;margin-top:20px; }
    .flash-actions .btn { flex:1;min-width:0; }

ые слова':'Ничего не найдено'}</h3><p>${state.wordFilter==='known'?'Открой карточку и нажми «Знаю».':'Попробуй другой запрос или выбери другой фильтр.'}</p><button class="btn btn-primary" data-action="word-filter" data-filter="all">Показать все слова</button></div>`}

function renderProgress(){const n=state.completedLessons.length;const earned=state.xp;const accuracy=percent();const week=Array.from({length:7},(_,i)=>{const off=i-6;return {date:dateOffset(off),label:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(dateOffset(off)+'T12:00:00').getDay()],xp:state.dailyXp[dateOffset(off)]||0};});const max=Math.max(10,...week.map(d=>d.xp));const badges=[{emoji:'🌱',name:'Первый шаг',desc:'Заработай первые 5 XP',ok:earned>=5},{emoji:'🔥',name:'Серия 3 дня',desc:'Занимайся 3 дня подряд',ok:state.streak>=3},{emoji:'📚',name:'Любознательный',desc:'Пройди 3 урока',ok:n>=3},{emoji:'🧠',name:'Словарик',desc:'Отметь 10 слов как знакомые',ok:state.knownWords.length>=10},{emoji:'🎯',name:'Точность',desc:'Ответь верно на 20 вопросов',ok:state.correct>=20},{emoji:'🏆',name:'Всё пройдено',desc:'Заверши все уроки',ok:n===lessons.length}];return `<div class="page-title-row"><div><div class="eyebrow">ТВОИ РЕЗУЛЬТАТЫ</div><h1>Ты растёшь 🌱</h1><p>Каждое занятие — маленькая победа.</p></div><div class="level-chip">Уровень B1</div></div><div class="stats-grid"><section class="stat-card"><div class="icon-box">${icon('flame')}</div><div class="stat-value">${state.streak}</div><div class="stat-label">Дней подряд</div></section><section class="stat-card"><div class="icon-box" style="background:var(--yellow);color:var(--yellow-ink)">${icon('trophy')}</div><div class="stat-value">${earned}</div><div class="stat-label">Всего XP</div></section><section class="stat-card"><div class="icon-box" style="background:var(--mint);color:var(--mint-ink)">${icon('book')}</div><div class="stat-value">${n}<span style="font-size:14px;color:var(--muted)">/${lessons.length}</span></div><div class="stat-label">Уроков пройдено</div></section><section class="stat-card"><div class="icon-box" style="background:var(--pink);color:var(--pink-ink)">${icon('target')}</div><div class="stat-value">${accuracy}%</div><div class="stat-label">Точность ответов</div></section></div>

function shuffleArray(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startPractice(mode){
  if(mode==='ru-en'){
    const chosen=shuffleArray(vocab).slice(0,10);
    const questions=chosen.map(word=>{const wrong=shuffleArray(vocab.filter(v=>v.id!==word.id)).slice(0,3);const options=shuffleArray([word,...wrong]);return {word,options,correctIndex:options.findIndex(v=>v.id===word.id)};});
    practice={type:mode,questions,index:0,selected:null,checked:false,correct:0,xpBefore:state.xp,finished:false};
  } else {
    const questions=shuffleArray(sentenceBank).slice(0,10).map(q=>({...q,bank:shuffleArray(q.en.replace(/[.!?]/g,'').split(/\s+/))}));
    practice={type:'sentence',questions,index:0,selected:null,checked:false,correct:0,xpBefore:state.xp,finished:false,draft:'',hintVisible:false,usedHint:false};
  }
  quiz=null;saveState();render();window.scrollTo({top:0,behavior:'smooth'});
}
function answerPractice(i){if(!practice||practice.checked||practice.finished)return;practice.selected=i;practice.checked=true;state.answered++;if(i===practice.questions[practice.index].correctIndex){practice.correct++;state.correct++;addXp(5);}else saveState();render();}
function checkSentence(){if(!practice||practice.checked||practice.finished)return;const q=practice.questions[practice.index];const normal=x=>String(x||'').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ');const accepted=[q.en,...(q.alts||[])].map(normal);practice.isCorrect=accepted.includes(normal(practice.draft));practice.checked=true;state.answered++;if(practice.isCorrect){practice.correct++;state.correct++;addXp(8);showToast('Отлично! +8 XP');}else saveState();render();}
function addSentenceToken(token){if(!practice||practice.type!=='sentence'||practice.checked)return;const area=document.getElementById('sentenceDraft');const start=area?area.selectionStart:practice.draft.length;const end=area?area.selectionEnd:start;const before=practice.draft.slice(0,start),after=practice.draft.slice(end);const needsSpace=before.length>0&&!/\s$/.test(before);practice.draft=before+(needsSpace?' ':'')+token+after;practice.usedHint=true;render();const next=document.getElementById('sentenceDraft');if(next){next.focus();const pos=practice.draft.length;next.setSelectionRange(pos,pos);}}
function nextPractice(){if(!practice)return;if(practice.index<practice.questions.length-1){practice.index++;practice.selected=null;practice.checked=false;practice.draft='';practice.hintVisible=false;practice.usedHint=false;practice.isCorrect=false;render();window.scrollTo({top:0,behavior:'smooth'});}else{practice.finished=true;streakUpdate();saveState();render();}}
function closePractice(){practice=null;saveState();render();}
function renderPractice(){
  const p=practice;const total=p.questions.length;const earned=state.xp-(p.xpBefore||0);
  if(p.finished){const pct=Math.round(p.correct/total*100);return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-practice" aria-label="Закрыть">${icon('close')}</button><div style="font-weight:800;font-size:14px">Практика завершена</div></div><div class="result-content"><div class="result-emoji">${pct>=90?'🏆':pct>=60?'🎉':'💪'}</div><h1>${pct>=90?'Супер результат!':pct>=60?'Хорошая работа!':'Продолжай тренироваться!'}</h1><p class="result-score">${p.type==='ru-en'?'Перевод слов с русского на английский':'Составление предложений'} · ${p.correct} из ${total} правильно</p><div class="result-points"><div><strong>+${earned}</strong><span>XP получено</span></div><div><strong>${pct}%</strong><span>Точность</span></div></div><p style="color:var(--muted);font-size:14px;max-width:340px;margin:0 auto 26px">${p.type==='sentence'?'Главная цель — вспоминать фразу самому. Подсказки можно использовать, пока не станет легче.':'Пробуй переводить с русского на английский каждый день — так слова начнут быстрее вспоминаться.'}</p><button class="btn btn-primary btn-full" data-action="close-practice">Продолжить ${icon('arrow',16)}</button><button class="btn btn-ghost btn-full" style="margin-top:9px" data-action="start-practice" data-mode="${p.type}">Повторить ещё раз</button></div></div>`;}
  const q=p.questions[p.index];
  if(p.type==='ru-en'){
    return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-practice" aria-label="Выйти из практики">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((p.index+(p.checked?1:0))/total*100)}%"></span></div><div class="quiz-counter">${p.index+1}/${total}</div></div><div class="quiz-content"><div class="quiz-tag">🧠 АКТИВНОЕ ВСПОМИНАНИЕ</div><h1 class="quiz-question">Как будет по-английски?</h1><p class="quiz-hint">Сначала вспомни слово сам, затем выбери ответ.</p><div class="practice-prompt">${esc(q.word.ru)}<div style="font-size:12px;color:var(--muted);font-weight:550;margin-top:8px">${q.word.topic}</div></div><div class="answer-list">${q.options.map((v,i)=>{let cls='';if(p.checked&&i===q.correctIndex)cls='correct';else if(p.checked&&i===p.selected)cls='wrong';return `<button class="answer-option ${cls}" data-action="practice-answer" data-index="${i}" ${p.checked?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span>${esc(v.en)}</span>${p.checked&&i===q.correctIndex?`<span style="margin-left:auto;color:#57d6a8">${icon('check',17)}</span>`:''}</button>`;}).join('')}</div>${p.checked?`<div class="feedback ${p.selected===q.correctIndex?'good':'bad'}"><strong>${p.selected===q.correctIndex?'Верно! Отлично 👏':'Правильный ответ:'}</strong><div style="margin-top:5px">${esc(q.word.en)} — ${esc(q.word.ru)}<br><span style="opacity:.86">${esc(q.word.ex)}</span></div><button class="text-button" data-action="speak" data-text="${esc(q.word.ex)}">${icon('speaker',13)} Послушать пример</button></div>`:''}</div><div class="quiz-footer">${p.checked?`<button class="btn btn-primary btn-full" data-action="practice-next">${p.index===total-1?'Завершить':'Следующее слово'} ${icon('arrow',16)}</button>`:`<p class="gesture-note">За правильный ответ — 5 XP.</p>`}</div></div>`;
  }
  return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-practice" aria-label="Выйти из практики">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((p.index+(p.checked?1:0))/total*100)}%"></span></div><div class="quiz-counter">${p.index+1}/${total}</div></div><div class="quiz-content"><div class="quiz-tag">✍️ СОСТАВЛЕНИЕ ПРЕДЛОЖЕНИЙ</div><h1 class="quiz-question">Скажи это по-английски</h1><p class="quiz-hint">Постарайся написать всё сам. Если застрянешь — открой подсказку со словами.</p><div class="practice-prompt">${esc(q.ru)}</div><label for="sentenceDraft" style="display:block;font-weight:750;font-size:13px;margin:0 0 8px">Твой вариант на английском</label><textarea id="sentenceDraft" class="practice-field" placeholder="Начни писать предложение здесь…" ${p.checked?'readonly':''}>${esc(p.draft)}</textarea><div class="card-heading" style="margin-top:13px"><button class="btn btn-ghost" data-action="toggle-hint" ${p.checked?'disabled':''}>${p.hintVisible?'Скрыть подсказку':'Подсказка: показать слова'}</button><button class="btn btn-outline" data-action="clear-draft" ${p.checked?'disabled':''}>Очистить</button></div>${p.hintVisible&&!p.checked?`<p class="subtext" style="margin:13px 0 4px">Слова в случайном порядке — нажимай, чтобы вставить в текст:</p><div class="word-bank">${q.bank.map((token,i)=>`<button class="word-token" data-action="sentence-token" data-token="${esc(token)}">${esc(token)}</button>`).join('')}</div><p class="gesture-note">${esc(q.hint||'Используй слова как подсказку и собери фразу самостоятельно.')}</p>`:''}${p.checked?`<div class="feedback ${p.isCorrect?'good':'bad'}"><strong>${p.isCorrect?'Правильно! Отличная работа 🎉':'Хорошая попытка — сравни с естественным вариантом.'}</strong><div style="margin-top:6px"><strong>Вариант:</strong> ${esc(q.en)}</div>${q.hint?`<div style="margin-top:5px;opacity:.9">💡 ${esc(q.hint)}</div>`:''}</div>`:''}</div><div class="quiz-footer">${p.checked?`<button class="btn btn-primary btn-full" data-action="practice-next">${p.index===total-1?'Завершить практику':'Следующее предложение'} ${icon('arrow',16)}</button>`:`<button class="btn btn-primary btn-full" data-action="check-sentence">Проверить мой вариант ${icon('arrow',16)}</button><p class="gesture-note">Правильный ответ приносит 8 XP. Варианты с тем же смыслом могут отличаться.</p>`}</div></div>`;
}

function renderQuiz(){const l=quiz.lesson;if(quiz.finished){const r=quiz.result;const total=r.total;const perfect=r.correct===total;return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-quiz" aria-label="Закрыть">${icon('close')}</button><div style="font-weight:800;font-size:14px">Урок завершён</div></div><div class="result-content"><div class="result-emoji">${perfect?'🏆':r.correct>=3?'🎉':'💪'}</div><h1>${perfect?'Идеально!':r.correct>=3?'Отличная работа!':'Хорошая практика!'}</h1><p class="result-score">${l.title} · ты ответил правильно на ${r.correct} из ${total} вопросов.</p><div class="result-points"><div><strong>+${quiz.xpEarned}</strong><span>XP получено</span></div><div><strong>${Math.round(r.correct/total*100)}%</strong><span>Точность</span></div></div><p style="color:var(--muted);font-size:14px;max-width:340px;margin:0 auto 26px">${perfect?'Все ответы верные — так держать!':`Повтори ошибки и попробуй ещё раз. Ошибки — это часть обучения.`} Твой прогресс сохранён на устройстве.</p><button class="btn btn-primary btn-full" data-action="close-quiz">Продолжить ${icon('arrow',16)}</button><button class="btn btn-ghost btn-full" style="margin-top:9px" data-action="lesson" data-id="${l.id}">Пройти ещё раз</button></div></div>`;}
const q=l.questions[quiz.index],letters=['A','B','C','D'];return `<div class="quiz-shell"><div class="quiz-top"><button class="icon-button" data-action="close-quiz" aria-label="Выйти из урока">${icon('close')}</button><div class="quiz-bar"><span style="width:${Math.round((quiz.index+(quiz.checked?1:0))/l.questions.length*100)}%"></span></div><div class="quiz-counter">${quiz.index+1}/${l.questions.length}</div></div><div class="quiz-content"><div class="quiz-tag">${l.emoji} ${l.tag} · ${l.title}</div><h1 class="quiz-question">${q.q}</h1><p class="quiz-hint">Выбери лучший вариант ответа.</p><div class="question-en">${q.en}<button class="icon-button" data-action="speak" data-text="${esc(q.en)}" aria-label="Прослушать фразу" style="float:right;margin-left:8px;width:34px;height:34px">${icon('speaker',16)}</button></div><div class="answer-list">${q.options.map((o,i)=>{let cls='';if(quiz.checked&&i===q.a)cls='correct';else if(quiz.checked&&i===quiz.selected)cls='wrong';else if(!quiz.checked&&i===quiz.selected)cls='selected';return `<button class="answer-option ${cls}" data-action="answer" data-index="${i}" ${quiz.checked?'disabled':''}><span class="answer-letter">${letters[i]}</span><span>${o}</span>${quiz.checked&&i===q.a?`<span style="margin-left:auto;color:#18815b">${icon('check',17)}</span>`:''}</button>`;}).join('')}</div>${quiz.checked?`<div class="feedback ${quiz.selected===q.a?'good':'bad'}"><strong>${quiz.selected===q.a?'Верно! Отлично 👏':'Почти! Запомни этот вариант.'}</strong><div style="margin-top:5px">${q.why}</div></div>`:''}<div style="margin-top:18px;background:#f7f7fc;padding:14px;border-radius:14px;font-size:12px;color:var(--muted)"><strong style="color:var(--text)">Подсказка</strong><br>${l.tip}</div></div><div class="quiz-footer">${quiz.checked?`<button class="btn btn-primary btn-full" data-action="next-question">${quiz.index===l.questions.length-1?'Завершить урок':'Дальше'} ${icon('arrow',16)}</button>`:`<button class="btn btn-primary btn-full" disabled style="opacity:.42;cursor:not-allowed">Выбери ответ</button>`}</div></div>`;}
function render(){const root=document.getElementById('app');if(quiz){root.innerHTML=renderQuiz();return;}if(practice){root.innerHTML=renderPractice();wireInputs();return;}const tabContent=state.tab==='home'?renderHome():state.tab==='lessons'?renderLessons():state.tab==='words'?renderWords():renderProgress();root.innerHTML=`<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">${icon('logo',23)}</div><div><div class="brand-name">englishly<span style="color:var(--accent)">.</span></div><div class="brand-tag">Английский в твоём ритме</div></div></div><div class="top-stats"><div class="pill"><span class="fire">🔥</span> ${state.streak}</div><div class="pill">${icon('trophy',14)} ${state.xp} XP</div></div></header><main>${tabContent}</main><nav class="bottom-nav" aria-label="Главная навигация"><div class="nav-inner"><button class="nav-item ${state.tab==='home'?'active':''}" data-action="tab" data-tab="home">${icon('home',21)}<span>Сегодня</span></button><button class="nav-item ${state.tab==='lessons'?'active':''}" data-action="tab" data-tab="lessons">${icon('book',21)}<span>Уроки</span></button><button class="nav-item ${state.tab==='words'?'active':''}" data-action="tab" data-tab="words">${icon('cards',21)}<span>Слова</span></button><button class="nav-item ${state.tab==='progress'?'active':''}" data-action="tab" data-tab="progress">${icon('chart',21)}<span>Прогресс</span></button></div></nav></div>`;wireInputs();wordDirection=1;}
function wireInputs(){
  const search=document.getElementById('wordSearch');
  if(search){search.addEventListener('input',e=>{const pos=e.target.selectionStart;state.wordSearch=e.target.value;state.currentWord=0;state.wordFlipped=false;const root=document.getElementById('app');const main=root.querySelector('main');main.innerHTML=renderWords();const next=document.getElementById('wordSearch');if(next){next.focus();next.setSelectionRange(pos,pos);}wireInputs();saveState();});}
  const goal=document.getElementById('goalSelect');if(goal)goal.addEventListener('change',e=>{state.goal=Number(e.target.value);saveState();render();showToast('Ежедневная цель обновлена');});
  const draft=document.getElementById('sentenceDraft');if(draft)draft.addEventListener('input',e=>{if(practice&&!practice.checked)practice.draft=e.target.value;});
  const card=document.querySelector('.flashcard');if(card){let sx=0,sy=0;card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});card.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.25){changeWord(dx<0?1:-1);}});}
}
function changeWord(dir){const list=selectedWords();if(!list.length)return;state.currentWord=(state.currentWord+dir+list.length)%list.length;state.wordFlipped=false;wordDirection=dir;saveState();render();}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action;switch(act){
case'tab':quiz=null;practice=null;navTab(btn.dataset.tab);break;
case'lesson':practice=null;startLesson(btn.dataset.id);break;
case'answer':chooseAnswer(Number(btn.dataset.index));break;
case'next-question':nextQuestion();break;
case'close-quiz':closeQuiz();break;
case'speak':speak(btn.dataset.text||'');break;
case'word-filter':state.wordFilter=btn.dataset.filter;state.currentWord=0;state.wordFlipped=false;saveState();render();break;
case'flip-word':state.wordFlipped=true;render();break;
case'next-word':changeWord(1);break;
case'prev-word':changeWord(-1);break;
case'select-word':{const list=selectedWords();const ix=list.findIndex(v=>v.id===btn.dataset.id);if(ix>=0){state.currentWord=ix;state.wordFlipped=true;wordDirection=1;render();window.scrollTo({top:0,behavior:'smooth'});}break;}
case'word-known':{const id=btn.dataset.id;if(!state.knownWords.includes(id)){state.knownWords.push(id);state.repeatWords=state.repeatWords.filter(x=>x!==id);addXp(2);showToast('Слово добавлено в «Знаю» · +2 XP');}else showToast('Это слово уже отмечено');state.wordFlipped=false;saveState();render();break;}
case'word-repeat':{const id=btn.dataset.id;state.repeatWords=Array.from(new Set([...state.repeatWords,id]));state.knownWords=state.knownWords.filter(x=>x!==id);state.wordFlipped=false;saveState();showToast('Добавлено на повторение');render();break;}
case'start-practice':startPractice(btn.dataset.mode);break;
case'practice-answer':answerPractice(Number(btn.dataset.index));break;
case'practice-next':nextPractice();break;
case'close-practice':closePractice();break;
case'check-sentence':checkSentence();break;
case'toggle-hint':if(practice&&!practice.checked){practice.hintVisible=!practice.hintVisible;render();}break;
case'clear-draft':if(practice&&!practice.checked){practice.draft='';render();document.getElementById('sentenceDraft')?.focus();}break;
case'sentence-token':addSentenceToken(btn.dataset.token);break;
case'reset':if(confirm('Точно сбросить весь прогресс? Это действие нельзя отменить.')){state=defaultState();quiz=null;practice=null;saveState();render();showToast('Прогресс сброшен');}break;
}});
if('serviceWorker'in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
</script>
</body>
</html>
